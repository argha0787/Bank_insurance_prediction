
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Prometheus monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI application monitoring
  - job_name: "insurance-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:8000"]
